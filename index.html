<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conde’s Doces</title>

<!-- Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* =====================================================
   FONTES LOCAIS
===================================================== */
@font-face{
  font-family:'Gallient';
  src:url('Gallient.ttf') format('truetype');
}

@font-face{
  font-family:'Beverly';
  src:url('Beverly.ttf') format('truetype');
}

/* =====================================================
   VARIÁVEIS DA MARCA
===================================================== */
:root{
  --bg-main:#FFFEEF;
  --bg-soft:#F3E6DA;
  --bg-card:#FFFDF9;

  --brown:#38180C;
  --brown-soft:#6B3E2E;

  --cta:#BE513A;
  --gold:#C9A24D;
}

/* =====================================================
   RESET GLOBAL
===================================================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  max-width:100%;
  overflow-x:hidden;
}

/* =====================================================
   BODY
===================================================== */
/* =====================================================
   BODY
===================================================== */

body{
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(
      rgba(30,10,5,.72),
      rgba(30,10,5,.82)
    ),
    url('hero.png') center/cover no-repeat;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Montserrat',sans-serif;
  color:#FFFEEF;

  padding:25px;
}

/* =====================================================
   BIO LINK
===================================================== */

.bio{
  width:100%;
  max-width:420px;

  background:rgba(255,255,255,.08);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,.08);

  border-radius:32px;

  padding:45px 30px;

  text-align:center;

  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
  width:140px;
  margin-bottom:15px;
}

.tag{
  display:inline-block;

  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;

  color:#F3E6DA;

  margin-bottom:20px;
}

.bio h1{
  font-family:'Gallient',serif;
  font-size:48px;
  line-height:1.05;

  margin-bottom:20px;
}

.bio p{
  font-size:15px;
  line-height:1.7;

  color:#F3E6DA;

  margin-bottom:30px;
}

.status{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:10px 18px;

  border-radius:999px;

  background:#C9A24D;

  color:#38180C;

  font-size:13px;
  font-weight:600;

  margin-bottom:28px;
}

/* =====================================================
   BOTÕES
===================================================== */

.buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.buttons a{
  text-decoration:none;

  background:#FFFDF9;

  color:#38180C;

  padding:16px;

  border-radius:18px;

  font-weight:600;

  transition:.3s;
}

.buttons a:hover{
  transform:translateY(-3px);
}

.buttons .gold{
  background:#BE513A;
  color:white;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:768px){

  .bio{
    padding:40px 24px;
  }

  .bio h1{
    font-size:40px;
  }

}
/* =====================================================
   FOOTER
===================================================== */

.footer{
  background:#2a120a;
  margin-top:60px;
  padding-top:40px;
  color:#F3E6DA;
}

.footer-container{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
  padding:0 25px 30px;
}

.footer-brand img{
  width:140px;
  margin-bottom:10px;
}

.footer-brand p{
  font-size:14px;
  line-height:1.6;
}

.footer h4{
  font-family:'Gallient';
  margin-bottom:10px;
  color:#C9A24D;
}

.footer ul{
  list-style:none;
  font-size:14px;
  line-height:1.8;
}

.footer-contato p{
  font-size:14px;
  margin-bottom:6px;
}

.footer-bottom{
  border-top:1px solid rgba(255,255,255,.1);
  text-align:center;
  padding:15px;
  font-size:13px;
  color:#d6c3b8;
}

.contato{
  text-align:center;
  padding:40px 20px;
}

.contato a{
  display:block;
  text-decoration:none;
  color:#F3E6DA;
  font-size:14px;
  margin:12px 0;
  transition:0.3s;
}

/* efeito ao passar o mouse */
.contato a:hover{
  color:#C9A24D;
  transform:scale(1.05);
}

/* RESPONSIVO */

@media(max-width:768px){

  .footer-container{
    grid-template-columns:1fr;
    text-align:center;
    gap:25px;
  }

  .footer-brand img{
    margin:auto;
  }


}

/* =====================================================
   RESPONSIVO
===================================================== */
@media(max-width:768px){

  header h1{ font-size:36px; }

  .hero{
    grid: none;
    padding:35px 25px;
  }

  .hero h2{
    font-size:34px;
  }
  .hero p{
    line-height: 1.2;
  }

  .produtos img{
    size: 50%;
  }

  header img.logo{
    max-width:80px;
  }
  header{
    padding: 5px;
  }
}

@media (max-width:768px){
  .carousel img{
    height:40%;
  }
}
/* =====================================================
   CARD MOBILE PROFISSIONAL
===================================================== */
@media (max-width:768px){


  .produtos{
    grid-template-columns:1fr;
    gap:30px;
    padding:20px;
  }

  .card{
    max-width:380px;
    margin:0 auto;
    padding:18px;
    border-radius:16px;
  }

  .card h3{
    font-size:22px;
    margin-top:10px;
  }

  .card h2{
    font-size:18px;
  }

  .desc{
    font-size:15px;
    line-height:1.6;
    padding:0 8px;
  }

  .mobile-row{
    margin-top:10px;
  }


  .desc{
    font-size:13px;
    margin-bottom:12px;
    text-align:center;
    max-width:280px;
    margin:0 auto;
    color:#6B3E2E;
  }


  .size{
    margin-bottom:10px;
  }

  .mobile-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }

  .price{
    font-size:22px;
    font-weight:700;
  }

  .qtd{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .qtd button{
    width:30px;
    height:30px;
    border-radius:6px;
    font-size:16px;
  }

  .card button{
    padding:16px;
    font-weight:600;
    border-radius:12px;
  }
}

@media (max-width:768px){

.destaques{
  grid-template-columns:1fr;
  gap:18px;
  padding:20px;
}

/* card */
.mini{
  display:grid;
  grid-template-columns:110px 1fr;
  align-items:center;

  padding:16px;
  border-radius:18px;

  gap:14px;

  background:#f4f1ee;
}

/* imagem */
.mini img{
  width:110px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

/* titulo */
.mini h4{
  font-size:22px;
  margin:0;
  color:#3b1a12;
}

/* descrição */
.mini p{
  font-size:14px;
  line-height:1.4;
  margin-top:6px;
  color:#6a4b40;
}

/* popup */
.popup-box{
  padding:30px 20px;
  width:90%;
  border-radius:16px;
}

}
</style>
</head>
</head>

<body>

<section class="bio">

  <img src="logocondes.png" alt="Conde's Doces" class="logo">

  <span class="tag">Doces finos • Confeitaria artesanal</span>

  <h1>
    Uma experiência<br>
    doce em cada detalhe
  </h1>

  <p>
    Estamos preparando um novo cardápio exclusivo
    para apresentar os doces finos da Thaís da forma
    que eles merecem ✨
  </p>

  <div class="status">
    Cardápio em construção
  </div>

  <div class="buttons">

    <a href="https://wa.me/55349929505?text=Quero%20fazer%20um%20or%C3%A7amento%20para%20doces!" target="_blank">
      Fazer orçamento
    </a>

    <a href="https://instagram.com/condes2025" target="_blank">
      Instagram
    </a>

    <a href="cardapio2026.html" target="_blank" class="gold">
      Entrar no site
    </a>

  </div>

</section>

</body>
</html>
